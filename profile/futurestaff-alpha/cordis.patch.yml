# Applied after the official dsh-base and dsh-web-app bundles.
# The login Profile never mounts legacy shared history. Authenticated workspaces
# override these rows with their fixed environment/tenant/user directories.
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('futurestaff/login/sessions')

- id: storage-json
  config:
    root: !!js dshHomePath('futurestaff/login/storages')

- id: attachment-local
  config:
    dshHome: !!js dshHomePath('futurestaff/login')

- id: settings
  name: '@futurestaff/fs-platform-access/managed-settings'
  config:
    dshHome: !!js dshHomePath('futurestaff/login')

# Keep appearance and personal interaction settings, remove upstream composition editors.
- id: ui-settings-plugins
  disabled: true

- id: ui-cordis
  disabled: true

- id: ui-agent-preset
  disabled: false

- id: ui-settings-models
  disabled: true

- id: agent-default-model
  disabled: true

- id: llm-deepseek
  disabled: true

- id: llm-pi-ai
  disabled: true

- insert:
    - id: futurestaff-core
      name: '@futurestaff/fs-core'
      config:
        identityMode: !!js process.env.FUTURESTAFF_IDENTITY_MODE
        tenantId: !!js process.env.FUTURESTAFF_TENANT_ID
        userId: !!js process.env.FUTURESTAFF_USER_ID
        deviceId: !!js process.env.FUTURESTAFF_DEVICE_ID || undefined
        visaAccessRole: !!js process.env.VISA_ACCESS_ROLE || 'collector'

    - id: futurestaff-platform-access
      name: '@futurestaff/fs-platform-access'
      config:
        environment: production

    - id: futurestaff-product-hub-ui
      name: '@futurestaff/fs-product-hub-ui'

    - id: futurestaff-douyin-ui
      name: '@futurestaff/fs-douyin-ui'
      config:
        database: !!js dshHomePath('futurestaff/login/douyin/leads.sqlite')

    # FutureStaff GEO local workspace v1
    - id: futurestaff-geo
      name: '@futurestaff/fs-geo'

    # FutureStaff video production local workspace v1
    - id: futurestaff-video
      name: '@futurestaff/fs-video'

    - id: mcp-selection-center
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js >-
        (process.env.PRODUCT_HUB_MCP_URL && process.env.PRODUCT_HUB_AGENT_KEY) ||
        !process.env.SELECTION_CENTER_BASE_URL ||
        !process.env.SELECTION_CENTER_API_KEY
      config:
        serverName: selection-center
        transport: stdio
        command: !!js process.execPath
        args: ['mcp/selection-center/lib/stdio.js']
        cwd: !!js process.cwd()
        env:
          SELECTION_CENTER_BASE_URL: !!js process.env.SELECTION_CENTER_BASE_URL
          SELECTION_CENTER_API_KEY: !!js process.env.SELECTION_CENTER_API_KEY
          SELECTION_CENTER_TIMEOUT_MS: !!js process.env.SELECTION_CENTER_TIMEOUT_MS
          FUTURESTAFF_TENANT_ID: !!js process.env.FUTURESTAFF_TENANT_ID
          FUTURESTAFF_USER_ID: !!js process.env.FUTURESTAFF_USER_ID
        toolCallTimeoutMs: 30000
        failOnStartupError: true

    - id: mcp-product-hub
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js >-
        !process.env.PRODUCT_HUB_MCP_URL ||
        !process.env.PRODUCT_HUB_AGENT_KEY
      config:
        serverName: product-hub
        transport: streamable-http
        url: !!js process.env.PRODUCT_HUB_MCP_URL
        headers:
          Authorization: !!js '`Bearer ${process.env.PRODUCT_HUB_AGENT_KEY}`'
        toolCallTimeoutMs: 60000
        failOnStartupError: true

    - id: mcp-local-runner
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js >-
        !process.env.RUNNER_GATEWAY_INTERNAL_URL ||
        !process.env.RUNNER_DISPATCH_TOKEN ||
        !process.env.RUNNER_ID ||
        !process.env.RUNNER_DEVICE_ID
      config:
        serverName: local-runner
        transport: stdio
        command: !!js process.execPath
        args: ['mcp/local-runner/lib/stdio.js']
        cwd: !!js process.cwd()
        env:
          RUNNER_GATEWAY_INTERNAL_URL: !!js process.env.RUNNER_GATEWAY_INTERNAL_URL
          RUNNER_DISPATCH_TOKEN: !!js process.env.RUNNER_DISPATCH_TOKEN
          RUNNER_ID: !!js process.env.RUNNER_ID
          RUNNER_DEVICE_ID: !!js process.env.RUNNER_DEVICE_ID
          RUNNER_DISPATCH_TIMEOUT_MS: !!js process.env.RUNNER_DISPATCH_TIMEOUT_MS
        toolCallTimeoutMs: 35000
        failOnStartupError: true

    - id: mcp-vietnam-visa
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js >-
        !process.env.VISA_ASSISTANT_MCP_URL ||
        !process.env.VISA_ASSISTANT_MCP_TOKEN
      config:
        serverName: vietnam-visa
        transport: streamable-http
        url: !!js process.env.VISA_ASSISTANT_MCP_URL
        headers:
          Authorization: !!js '`Bearer ${process.env.VISA_ASSISTANT_MCP_TOKEN}`'
        toolCallTimeoutMs: 60000
        failOnStartupError: true
